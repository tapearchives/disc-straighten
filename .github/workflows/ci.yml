name: CLI validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install imagemagick tesseract exiftool
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick.app tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem 'C:\Program Files' -Directory -Filter 'ImageMagick*' | ForEach-Object { $_.FullName >> $env:GITHUB_PATH }
          'C:\Program Files\Tesseract-OCR' >> $env:GITHUB_PATH
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Disc geometry, OCR and rendering
        run: python examples/synthetic_smoke.py
      - name: Default disc fallback with unavailable OCR
        run: python examples/synthetic_smoke.py --unavailable-ocr
      - name: Cassette routing, OCR and rendering
        run: python examples/cassette_smoke.py
      - name: Test alternate Tesseract backend on macOS
        if: runner.os == 'macOS'
        env:
          DISC_TEST_OCR: tesseract
        run: |
          python examples/synthetic_smoke.py
          python examples/cassette_smoke.py
      - name: Exercise CMD launcher in a path with spaces
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python package.py --export-tree "%RUNNER_TEMP%\de-askew Kit"
          call "%RUNNER_TEMP%\de-askew Kit\de-askew.cmd" -h
          if errorlevel 1 exit /b 1
          call "%RUNNER_TEMP%\de-askew Kit\de-askew.cmd" --version
          if errorlevel 1 exit /b 1
      - name: Launch Windows drag-and-drop GUI
        if: runner.os == 'Windows'
        run: |
          python -m pip install tkinterdnd2==0.6.3
          python -m discstraight.windows_gui --smoke-test
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify source archive
        run: python package.py
      - name: Build and verify native Mac app
        if: runner.os == 'macOS'
        run: python build_macos.py
