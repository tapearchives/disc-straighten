[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "de-askew"
version = "0.10.0"
description = "Archival disc and cassette image rectification, transparent derivatives, and geometry logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "opencv-python-headless==5.0.0.93", "zxing-cpp==3.1.1", "reportlab==4.4.10", "pillow==12.3.0", "charset-normalizer==3.5.2", "pypdfium2==5.14.0"]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
de-askew = "discstraight.cli:main"
un-askew = "discstraight.cli:main"
disc-straighten = "discstraight.cli:main"

[project.urls]
Repository = "https://github.com/tapearchives/disc-straighten"
Issues = "https://github.com/tapearchives/disc-straighten/issues"

[tool.setuptools]
packages = ["discstraight"]

[tool.setuptools.package-data]
discstraight = ["vision.swift", "ui_theme.json", "manual/*.html", "manual/*.json", "manual/*.md", "manual/images/*.jpg", "manual/images/*.png"]
