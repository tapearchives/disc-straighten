[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-straighten"
version = "0.6.0"
description = "Archival disc and cassette image rectification, transparent derivatives, and geometry logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "opencv-python-headless==5.0.0.93"]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
disc-straighten = "discstraight.cli:main"

[tool.setuptools]
packages = ["discstraight"]

[tool.setuptools.package-data]
discstraight = ["vision.swift"]
